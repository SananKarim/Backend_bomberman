services:
  - type: web
    name: neon-bomber-backend
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SIM_TICK_MS
        value: "50"
      - key: BROADCAST_MS
        value: "100"
